<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suwana Vote Survey</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 text-center shadow-md">
        <h1 class="text-2xl md:text-3xl font-bold text-amber-400">सुवाणा पंचायत सर्वे (Suwana Vote Survey)</h1>
        <p class="text-sm text-slate-400 mt-1">यह एक अनौपचारिक जनमत सर्वे है, आधिकारिक चुनाव परिणाम नहीं।</p>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-4xl flex-grow">
        
        <!-- Status / Message Box -->
        <div id="messageBox" class="hidden mb-6 p-4 rounded-lg text-center font-medium"></div>

        <!-- Candidates Grid -->
        <section class="mb-12">
            <h2 class="text-xl font-semibold mb-6 text-center border-b border-slate-700 pb-2">अपने उम्मीदवार को चुनें</h2>
            <div id="candidatesGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- JavaScript से उम्मीदवार यहाँ लोड होंगे -->
                <div class="text-center text-slate-400 col-span-2">लोड हो रहा है...</div>
            </div>
        </section>

        <!-- Live Scoreboard -->
        <section class="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
            <h2 class="text-xl font-semibold mb-6 text-center text-amber-400">📊 लाइव स्कोरबोर्ड (Live Scoreboard)</h2>
            <div id="scoreboard" class="space-y-4">
                <!-- स्कोरबोर्ड यहाँ लोड होगा -->
                <div class="text-center text-slate-400">डेटा लोड हो रहा है...</div>
            </div>
            <div class="mt-6 text-center text-sm text-slate-400 border-t border-slate-700 pt-4">
                कुल वोट: <span id="totalVotesCount" class="font-bold text-white">0</span>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-500">
        &copy; 2026 Suwana Vote Survey. सर्वाधिकार सुरक्षित।
    </footer>

    <!-- Supabase Connection & App Logic Script -->
    <script>
        // Supabase की डिटेल्स यहाँ सेट हैं
        const SUPABASE_URL = 'https://ariberergxtylancqfet.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_JwEl-pKRGNepXAkCn1QlW_E676pQ=='; // अपनी पूरी Publishable Key यहाँ सुनिश्चित कर लें

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // डिवाइस की पहचान के लिए यूनिक आईडी बनाना
        function getDeviceIdentifier() {
            let deviceId = localStorage.getItem('suwana_device_id');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now();
                localStorage.setItem('suwana_device_id', deviceId);
            }
            return deviceId;
        }

        async function fetchCandidatesAndVotes() {
            try {
                // 1. उम्मीदवार लाएं
                const { data: candidates, error: candError } = await supabaseClient
                    .from('candidates')
                    .select('*')
                    .order('id');

                if (candError) throw candError;

                // 2. कुल वोट लाएं
                const { data: votes, error: voteError } = await supabaseClient
                    .from('votes')
                    .select('candidate_id');

                if (voteError) throw voteError;

                renderUI(candidates, votes);
            } catch (err) {
                console.error('Error fetching data:', err);
                document.getElementById('candidatesGrid').innerHTML = '<div class="text-red-400 col-span-2 text-center">डेटा लोड करने में समस्या हुई। कृपया कनेक्शन जांचें।</div>';
            }
        }

        function renderUI(candidates, votes) {
            const grid = document.getElementById('candidatesGrid');
            const scoreboard = document.getElementById('scoreboard');
            const totalVotesCountEl = document.getElementById('totalVotesCount');

            let totalVotes = votes.length;
            let voteCounts = {};
            candidates.forEach(c => voteCounts[c.id] = 0);
            votes.forEach(v => {
                if (voteCounts[v.candidate_id] !== undefined) {
                    voteCounts[v.candidate_id]++;
                }
            });

            totalVotesCountEl.innerText = totalVotes;

            // उम्मीदवारों के कार्ड रेंडर करना
            grid.innerHTML = candidates.map(c => `
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col items-center text-center shadow-lg hover:border-amber-400 transition">
                    <div class="w-24 h-24 bg-slate-700 rounded-full mb-4 overflow-hidden flex items-center justify-center border-2 border-amber-400/50">
                        ${c.photo_url ? `<img src="${c.photo_url}" alt="${c.name}" class="w-full h-full object-cover">` : `<span class="text-3xl text-slate-400">👤</span>`}
                    </div>
                    <h3 class="text-lg font-bold mb-3 text-white">${c.name}</h3>
                    <button onclick="castVote(${c.id})" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 px-4 rounded-lg transition shadow cursor-pointer">
                        Vote करें
                    </button>
                </div>
            `).join('');

            // स्कोरबोर्ड रेंडर करना
            scoreboard.innerHTML = candidates.map(c => {
                let count = voteCounts[c.id] || 0;
                let percentage = totalVotes > 0 ? ((count / totalVotes) * 100).toFixed(1) : 0;
                return `
                    <div>
                        <div class="flex justify-between text-sm mb-1">
                            <span class="font-medium text-white">${c.name}</span>
                            <span class="text-slate-400">${count} वोट (${percentage}%)</span>
                        </div>
                        <div class="w-full bg-slate-700 rounded-full h-3 overflow-hidden">
                            <div class="bg-amber-400 h-3 rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function castVote(candidateId) {
            const deviceId = getDeviceIdentifier();

            try {
                const { error } = await supabaseClient
                    .from('votes')
                    .insert([{ candidate_id: candidateId, device_identifier: deviceId }]);

                if (error) {
                    if (error.code === '23505') {
                        showTranslatedMessage('आपने आज इस डिवाइस से पहले ही वोट दे दिया है!', 'bg-red-500/20 text-red-300 border border-red-500/50');
                    } else {
                        throw error;
                    }
                    return;
                }

                showTranslatedMessage('आपका वोट सफलतापूर्वक दर्ज हो गया है! धन्यवाद।', 'bg-green-500/20 text-green-300 border border-green-500/50');
                fetchCandidatesAndVotes(); // स्कोरबोर्ड रिफ्रेश करें
            } catch (err) {
                console.error('Voting error:', err);
                showTranslatedMessage('वोट दर्ज करने में त्रुटि हुई। कृपया पुनः प्रयास करें।', 'bg-red-500/20 text-red-300 border border-red-500/50');
            }
        }

        function showTranslatedMessage(text, className) {
            const box = document.getElementById('messageBox');
            box.className = `mb-6 p-4 rounded-lg text-center font-medium ${className}`;
            box.innerText = text;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 5000);
        }

        // पेज लोड होने पर डेटा लाएं
        fetchCandidatesAndVotes();
    </script>
</body>
</html>
